<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typora Canvas · 阅读渲染原型</title>
<style>
body{margin:0;background:#f5f7fb;color:#243044;font:16px/1.8 "Segoe UI","Microsoft YaHei",sans-serif}
main{max-width:760px;margin:12vh auto;padding:30px}h1{font-size:38px;margin-bottom:4px}p{color:#63728a}
button,label,input{font:inherit}button,label{display:inline-block;padding:10px 18px;border:1px solid #b8c8de;border-radius:8px;background:white;cursor:pointer}
input[type=number]{width:100px;padding:8px;border:1px solid #b8c8de;border-radius:6px}input[type=file]{display:none}
.muted{font-size:14px}code{background:#e8edf6;padding:2px 6px}
</style></head><body><main>
<h1>Typora Canvas</h1><p>Typora 插件的 Canvas 阅读渲染原型</p>
<p>全文按块建立高度索引，只排版视口附近内容。Canvas 尺寸随窗口变化，与全文长度无关。</p>
<p>模式 <select id="mode" aria-label="渲染模式"><option value="reader">Canvas 阅读器</option><option value="canvas-editor">纯 Canvas 编辑实验</option></select></p>
<p>压力测试章节数 <input id="sections" type="number" min="1" max="10000" value="1000" aria-label="压力测试章节数"></p>
<button id="sample">打开压力测试</button> <label>打开本地 Markdown<input id="file" type="file" accept=".md,.markdown,.txt,text/plain"></label>
<p class="muted">文件只在本机读取。纯 Canvas 编辑实验支持源码无损编辑、选区、撤销、正则搜索以及公式和图片绘制；当前编辑行显示 Markdown 原文。保存会下载一份 .md 文件，不会覆盖浏览器选取的原文件。</p>
<p class="muted"><code>Ctrl+F</code> 搜索全文，<code>Enter</code> 下一个匹配块，<code>Esc</code> 返回。</p><p id="status" role="status"></p>
</main><script src="/demo.js"></script></body></html>
