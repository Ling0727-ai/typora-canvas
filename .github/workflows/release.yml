name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'const p=require("./package.json");if(process.env.RELEASE_TAG!=="v"+p.version)throw new Error("Tag does not match package.json")'
      - uses: actions/download-artifact@v4
        with:
          name: release-files-ubuntu-latest
          path: dist/release
      - name: Verify release checksums
        working-directory: dist/release
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish validated plugin archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/release/* --verify-tag --title "Typora Canvas $RELEASE_TAG" --notes-file RELEASE_NOTES.md
